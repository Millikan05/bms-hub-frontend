<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KIUT | For Students - Resources</title>
    <link rel="stylesheet" href="style.css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" />
    <style>
        /* Minimal inline styles for this template */
        .resource-page { max-width: 900px; margin: 0 auto; padding: 20px; }
        .resource-header { background: #fff; padding: 25px 30px; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); margin-bottom: 25px; border-left: 5px solid #c8102e; }
        .resource-header h1 { font-size: 1.6rem; margin: 0 0 5px; color: #1a1a2e; }
        .resource-header .meta { color: #777; font-size: 0.95rem; }
        .resource-header .meta i { margin-right: 6px; color: #c8102e; }
        .resource-section { background: #fff; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.06); padding: 20px 25px; margin-bottom: 20px; }
        .resource-section h3 { font-size: 1.1rem; margin: 0 0 15px; padding-bottom: 8px; border-bottom: 2px solid #f0f2f5; color: #1a1a2e; }
        .resource-section h3 i { color: #c8102e; margin-right: 10px; }
        .resource-list { list-style: none; padding: 0; margin: 0; }
        .resource-list li { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid #f5f5f5; }
        .resource-list li:last-child { border-bottom: none; }
        .resource-list li i { font-size: 1.2rem; width: 24px; text-align: center; }
        .resource-list li .file-icon-pdf { color: #c8102e; }
        .resource-list li .file-icon-ppt { color: #d24726; }
        .resource-list li .file-icon-word { color: #2b5797; }
        .resource-list li .file-icon-video { color: #0077b6; }
        .resource-list li .file-icon-zip { color: #ff9f00; }
        .resource-list li a { flex: 1; color: #0056b3; text-decoration: none; }
        .resource-list li a:hover { text-decoration: underline; }
        .resource-list li .size { font-size: 0.8rem; color: #999; white-space: nowrap; }
        .back-link { display: inline-block; margin-bottom: 15px; color: #555; text-decoration: none; }
        .back-link:hover { color: #c8102e; }
        .back-link i { margin-right: 6px; }
        .upload-area { margin-top: 15px; padding: 15px; background: #f8f9fa; border: 2px dashed #ddd; border-radius: 8px; text-align: center; color: #999; font-size: 0.9rem; }
        .upload-area i { font-size: 1.5rem; display: block; margin-bottom: 5px; }
		.mpebtn{border-radius:20px; border:none; background-color:pink;}
		.mpebtn:hover{background:lightblue;}
		body{background:linear-gradient(pink,lightblue);}
    </style>
</head>
<body>

    <!-- Simple Header -->
    <header style="background:#fff;border-bottom:3px solid #c8102e;padding:12px 0;">
        <div class="container" style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;">
            <a href="index.html" style="font-weight:700;font-size:1.3rem;color:#c8102e;text-decoration:none;">
                <i class="fas fa-chevron-left" style="font-size:0.9rem;color:#333;margin-right:10px;"></i> BMS HUB
            </a>
            <span style="font-size:0.9rem;color:#555;">Faculty of Medicine</span>
        </div>
    </header>

    <!-- Page Content -->
    <div class="resource-page">

        <!-- Course Header -->
        <div class="resource-header">
            <h1>MPE 114: Professionalism and Ethics</h1>
            <div class="meta">
                <span><i class="fas fa-calendar-alt"></i> Semester 2 · Year 2</span>
                <span style="margin-left:20px;"><i class="fas fa-clock"></i> Credits:16</span>
                <span style="margin-left:20px;"><i class="fas fa-user"></i> Dr Josephat Kipesha, Dr Valiant, Dr Iboro, Dr Omoiri</span>
            </div>
        </div>

        <!-- Resources Section -->
        <div class="resource-section">
          <button class="mcpbtn"><h1><a href="pharmacology all slides.rar">Download Basic and Clinical Pharmacology All slides and Resources</h1></button>
            
        </div>

        <div class="resource-section">
           
		   
        </div>

       

        

        <!-- Upload Area (Admin Only) -->
        <div class="upload-area">
            <i class="fas fa-cloud-upload-alt"></i>
            <p>Administrators can upload new resources here.</p>
            <a href="#" class="btn btn-sm btn-primary" style="pointer-events:none;opacity:0.6;display:inline-block;padding:4px 16px;background:#c8102e;color:#fff;border-radius:4px;text-decoration:none;font-size:0.85rem;">Upload (Admin)</a>
        </div>

        <!-- Back Link -->
        <p style="margin-top:20px;text-align:center;">
            <a href="index.html#courses" class="back-link"><i class="fas fa-arrow-left"></i> Back to Courses</a>
        </p>

    </div>

    <!-- Footer -->
    <footer style="background:#1a1a2e;color:#f0f0f0;padding:15px 0;text-align:center;font-size:0.9rem;margin-top:20px;">
        <p style="margin:0;">&copy; 2026 KIUT BMS Resource Hub. All rights reserved.</p>
    </footer>

</body>
</html>
